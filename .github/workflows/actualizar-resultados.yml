name: Actualizar resultados Mundial

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests openpyxl

      - name: Ejecutar script de actualización
        run: |
          python actualizar_resultados.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add resultados.xlsx

          git diff --staged --quiet && exit 0

          git commit -m "Actualizar resultados Mundial [auto]"

          git pull --rebase origin main || true
          git push origin HEAD:main
